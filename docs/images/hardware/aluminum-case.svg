  <title id="title">Abstract metal enclosure</title>
  <desc id="description">Simplified three-quarter view matching the first reference: silver metal enclosure, charcoal honeycomb lid, four screws and empty openings. No circuit board, fan or internal electronics. Transparent background. All elements are editable vector paths.</desc>
